name: iOS

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Versi Xcode dan simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -60

      - name: Pilih simulator iPhone
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | .value[] | select(.name | test("^iPhone"))] | .[0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "Tidak ada simulator iPhone yang tersedia" >&2
            exit 1
          fi
          echo "Simulator dipakai: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Pasang XcodeGen
        run: brew install xcodegen

      - name: Buat proyek Xcode
        working-directory: ios
        run: xcodegen generate && ls -la

      - name: Bangun aplikasi
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project LerengOffline.xcodeproj \
            -scheme LerengOffline \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | tail -n 150

      - name: Uji unit
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project LerengOffline.xcodeproj \
            -scheme LerengOffline \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log | tail -n 200

      - name: Simpan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            ios/build.log
            ios/test.log
          if-no-files-found: ignore
