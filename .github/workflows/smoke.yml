name: Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/smoke.yml"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Info
        run: |
          echo "hello from ${{ runner.os }}"
          uname -a

  macos:
    runs-on: macos-latest
    steps:
      - name: Info
        run: |
          echo "hello from ${{ runner.os }}"
          sw_vers
          xcodebuild -version
