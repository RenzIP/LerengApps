name: LerengOffline
options:
  bundleIdPrefix: id.bagas.lerengoffline
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Automatic

targets:
  LerengOffline:
    type: application
    platform: iOS
    sources:
      - path: LerengOffline
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.bagas.lerengoffline.ios
        PRODUCT_NAME: LerengOffline
        MARKETING_VERSION: "1.4.2"
        CURRENT_PROJECT_VERSION: "7"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LERENG_SYNC_ENDPOINT: "https://lereng.bagasip.my.id"
        LERENG_SYNC_TOKEN: "a496ec3bae68f5fd2424206aa097fa3e642ca6b34f959a95"
    info:
      path: LerengOffline/Info.plist
      properties:
        CFBundleDisplayName: Lereng Offline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LerengSyncEndpoint: $(LERENG_SYNC_ENDPOINT)
        LerengSyncToken: $(LERENG_SYNC_TOKEN)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Lereng Offline merekam jalur pendakian di perangkat ini. Data baru dikirim otomatis ke endpoint HTTPS milikmu bila sinkron otomatis aktif."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Rekaman jalur perlu berlanjut saat layar mati. Data tersimpan lokal dan dikirim otomatis ke endpoint milikmu."
        NSBluetoothAlwaysUsageDescription: "BLE hanya bertukar ID samaran dan waktu untuk mencatat siapa yang terlihat di rombongan. Tidak ada jarak, posisi, atau MAC."
        BGTaskSchedulerPermittedIdentifiers:
          - id.bagas.lerengoffline.sync
        UIBackgroundModes:
          - location
          - fetch
          - bluetooth-central
          - bluetooth-peripheral

  LerengOfflineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LerengOfflineTests
    dependencies:
      - target: LerengOffline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.bagas.lerengoffline.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LerengOffline.app/LerengOffline"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LerengOffline:
    build:
      targets:
        LerengOffline: all
        LerengOfflineTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - LerengOfflineTests
    run:
      config: Debug
