plugins {
    id 'com.android.application'
}

// Pemeriksaan pembaruan: isi lewat -PlerengUpdateUrl=https://... atau gradle.properties.
// Kosong berarti fitur nonaktif dan APK tetap sepenuhnya offline.
def lerengUpdateUrl = (project.findProperty('lerengUpdateUrl') ?: '').toString()

android {
    namespace 'id.bagas.lerengoffline'
    compileSdk 35

    defaultConfig {
        applicationId 'id.bagas.lerengoffline'
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName '2.5.3'
        buildConfigField 'String', 'UPDATE_MANIFEST_URL', "\"${lerengUpdateUrl}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Fused Location Provider: menggabungkan GNSS + Wi-Fi + sel seperti aplikasi olahraga populer.
    // Ada fallback LocationManager bila perangkat tidak punya Google Play Services.
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
